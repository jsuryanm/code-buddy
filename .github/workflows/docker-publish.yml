# Build the CodeBuddy image and push it to GitHub Container Registry (ghcr.io), for the AWS
# deployment in deploy/aws. linux/amd64 only (the template runs x86_64 t3 instances).
# Tags: latest (main branch) and the short commit sha, for example ghcr.io/<owner>/code-buddy:3f2a1bc
#
# The package is PRIVATE after the first push. The server pulls without credentials, so do this
# once: GitHub > your profile > Packages > code-buddy > Package settings > Change visibility >
# Public. To keep it private instead, create a classic personal access token with only
# read:packages and store it in SSM as GHCR_USER and GHCR_TOKEN (scripts/put-secrets.sh
# --only GHCR_USER --only GHCR_TOKEN); the server then runs docker login before pulling.
#
# Every action is pinned to a full commit SHA (the version is in the trailing comment), so a
# moved tag cannot change what runs with the packages:write token. .github/dependabot.yml opens
# weekly pull requests to refresh the pins.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repository name (ghcr.io requires it) and computes the tags.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            EXTRAS=--extra ui --extra trace
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
