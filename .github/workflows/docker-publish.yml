# Build the CodeBuddy image and push it to GitHub Container Registry (ghcr.io), for the AWS
# deployment in deploy/aws. linux/amd64 only (the template runs x86_64 t3 instances).
# Tags: latest (main branch) and the short commit sha, for example ghcr.io/<owner>/code-buddy:3f2a1bc
#
# The package is PRIVATE after the first push. The server pulls without credentials, so do this
# once: GitHub > your profile > Packages > code-buddy > Package settings > Change visibility >
# Public. To keep it private instead, create a classic personal access token with only
# read:packages and store it in SSM as GHCR_USER and GHCR_TOKEN (scripts/put-secrets.sh
# --only GHCR_USER --only GHCR_TOKEN); the server then runs docker login before pulling.
#
# Actions are pinned to major versions. Pinning each one to a full commit SHA is a further
# hardening step (Dependabot can keep SHAs current).
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repository name (ghcr.io requires it) and computes the tags.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            EXTRAS=--extra ui --extra trace
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
