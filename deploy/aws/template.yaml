AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CodeBuddy on the AWS free tier: one EC2 instance running the prebuilt image (API + Streamlit
  UI) behind Caddy with HTTPS and basic auth. Secrets come from SSM Parameter Store. Authored
  and checked offline only (cfn-lint); see deploy/aws/README.md.

# Cost and safety notes (free plan for accounts created on/after 2025-07-15):
# - The free plan gives credits for 6 months; then the account closes unless you upgrade.
#   t3.micro, t3.small and t4g.* are eligible instance types (this template is x86_64 only).
# - Public IPv4 costs $0.005 per hour (about $3.60 a month), also while the instance is
#   stopped. UNCONFIRMED whether the free plan covers it; assume it uses credits.
# - A stopped instance still bills its EBS volume and the Elastic IP. To stop all charges,
#   delete the stack (scripts/destroy.sh). Nothing here uses DeletionPolicy Retain: the EBS
#   root volume, the Elastic IP, the role and the security group all go with the stack.
#   Your data lives outside AWS (Qdrant Cloud, Upstash, Langfuse); SSM parameters stay.
# - Nothing here is billed per request: no ALB, NAT gateway, RDS, ElastiCache or Route 53.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Network}
        Parameters: [VpcId, SubnetId, AllowedCidr]
      - Label: {default: Server}
        Parameters: [InstanceType, VolumeSizeGiB, LatestAmiId]
      - Label: {default: App}
        Parameters: [ImageUri, SsmPrefix, DomainName, BasicAuthUser]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the server. The default VPC is fine.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A PUBLIC subnet of that VPC (any default-VPC subnet is public).
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.micro]
    Description: t3.small (2 GiB) is the default; t3.micro (1 GiB) works with swap but is slow.
  VolumeSizeGiB:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 30
    Description: Root disk size in GiB (gp3, encrypted). The free plan covers up to 30 GiB.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      Amazon Linux 2023 image, looked up at deploy time. A newer image on a later deploy
      replaces the server (it is stateless; Caddy fetches a new certificate).
  ImageUri:
    Type: String
    Default: ghcr.io/jsuryanm/code-buddy:latest
    AllowedPattern: "^[a-z0-9][a-z0-9./_:@-]*$"
    Description: Container image built by .github/workflows/docker-publish.yml (linux/amd64).
  SsmPrefix:
    Type: String
    Default: /code-buddy
    AllowedPattern: "^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$"
    Description: SSM Parameter Store path holding the secrets (scripts/put-secrets.sh).
  DomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$"
    Description: >-
      Your own hostname pointing at the Elastic IP, or empty to use
      <ip-with-dashes>.sslip.io (works without buying a domain).
  BasicAuthUser:
    Type: String
    Default: tutor
    AllowedPattern: "^[A-Za-z0-9_.-]{1,32}$"
    Description: User name for the site's basic auth. The password hash lives in SSM.
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: >-
      Who may reach ports 80 and 443. Narrowing it breaks automatic Let's Encrypt
      certificates, which need both ports open to the internet.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CodeBuddy web (HTTP for certificates and redirect, HTTPS). No SSH.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr,
           Description: HTTP (Let's Encrypt challenge and redirect to HTTPS)}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedCidr,
           Description: HTTPS}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodeBuddy server. Session Manager access and read-only access to its secrets.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-codebuddy-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # GetParametersByPath is authorized on the path itself, GetParameter on each name.
              - Effect: Allow
                Action: [ssm:GetParametersByPath, ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
              # SecureString values use the AWS managed key aws/ssm; decrypt only through SSM.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Ref AWS::StackName}

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
          AssociatePublicIpAddress: true   # internet for setup until the Elastic IP attaches
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSizeGiB
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required          # IMDSv2 only
        HttpPutResponseHopLimit: 1    # containers cannot reach the instance credentials
      Tags:
        - {Key: Name, Value: !Ref AWS::StackName}
      # Raw UserData must stay under 16 KB (a unit test checks the rendered size). Only the
      # first part goes through Fn::Sub; the rest is literal, so ${...} there is shell/compose.
      UserData:
        Fn::Base64:
          Fn::Join:
            - ""
            - - Fn::Sub:
                  - |
                    #!/bin/bash
                    # CodeBuddy bootstrap, first boot only. Follow it with:
                    #   sudo tail -f /var/log/codebuddy-bootstrap.log
                    set -euo pipefail
                    IMAGE_URI='${ImageUri}'
                    SITE_ADDRESS='${SiteAddress}'
                    BASIC_AUTH_USER='${BasicAuthUser}'
                    SSM_PREFIX='${SsmPrefix}'
                    REGION='${AWS::Region}'
                    EIP_ADDRESS='${ElasticIp.PublicIp}'
                  - SiteAddress: !If
                      - HasDomain
                      - !Ref DomainName
                      - !Join
                        - ""
                        - - !Join ["-", !Split [".", !GetAtt ElasticIp.PublicIp]]
                          - .sslip.io
              - |
                set -o errtrace
                exec > >(tee -a /var/log/codebuddy-bootstrap.log) 2>&1
                trap 'echo "CODEBUDDY BOOTSTRAP FAILED (exit $?) at line $LINENO. See /var/log/codebuddy-bootstrap.log and /var/log/cloud-init-output.log"' ERR
                log() { echo "[codebuddy $(date -u +%FT%TZ)] $*"; }
                COMPOSE_VERSION=v2.40.3
                COMPOSE_SHA256=dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372

                log "installing docker and the compose plugin $COMPOSE_VERSION"
                dnf install -y docker
                curl -fsSL -o /tmp/docker-compose \
                  "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
                echo "$COMPOSE_SHA256  /tmp/docker-compose" | sha256sum -c -
                install -D -m 755 /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
                systemctl enable --now docker

                log "creating 2 GiB swap"
                if [ ! -f /swapfile ]; then
                  fallocate -l 2G /swapfile
                  chmod 600 /swapfile
                  mkswap /swapfile
                  echo '/swapfile none swap defaults 0 0' >> /etc/fstab
                fi
                swapon --show | grep -q /swapfile || swapon /swapfile
                echo 'vm.swappiness=10' > /etc/sysctl.d/90-codebuddy.conf
                sysctl -q -p /etc/sysctl.d/90-codebuddy.conf

                log "writing /opt/codebuddy"
                install -d -m 755 /opt/codebuddy
                install -d -m 755 -o 10001 -g 10001 /opt/codebuddy/logs
                printf '%s\n' "IMAGE_URI=$IMAGE_URI" "SITE_ADDRESS=$SITE_ADDRESS" \
                  "BASIC_AUTH_USER=$BASIC_AUTH_USER" "SSM_PREFIX=$SSM_PREFIX" "AWS_REGION=$REGION" \
                  > /opt/codebuddy/site.env
                cat > /opt/codebuddy/docker-compose.yml <<'COMPOSE'
                # CodeBuddy on one AWS EC2 instance (deploy/aws/template.yaml). Lives in /opt/codebuddy on the
                # server; the same text is embedded in the template's UserData (a unit test keeps them equal).
                # Authored and checked statically only: never run (no Docker daemon in the dev shell).
                #
                # Values come from /opt/codebuddy/.env, written from SSM Parameter Store by codebuddy-env
                # (single-quoted, so a "$" in the bcrypt hash is kept literally). Never edit secrets in here.
                # Only Caddy publishes ports (80, 443). The API stays on the private compose network; the UI
                # reaches it as http://api:8000 with an API key. Memory limits fit a 2 GiB t3.small plus swap.
                name: codebuddy

                x-logging: &logging
                  driver: json-file
                  options:
                    max-size: "10m"
                    max-file: "3"

                x-app: &app
                  image: ${IMAGE_URI:?set IMAGE_URI in .env}
                  restart: unless-stopped
                  pids_limit: 256
                  logging: *logging

                services:
                  api:
                    <<: *app
                    env_file: [.env]
                    environment:
                      CODEBUDDY_MEMORY_ENABLED: "false"   # learner memory stays off on this deployment
                    volumes:
                      - /opt/codebuddy/logs:/app/logs     # owned by uid 10001 (the image's user)
                      - app-data:/app/data                # checkpoints and manifest
                    mem_limit: 800m

                  ui:
                    <<: *app
                    command: ["streamlit", "run", "src/codebuddy/ui/app.py", "--server.port", "8501",
                              "--server.address", "0.0.0.0", "--server.headless", "true"]
                    environment:
                      CODEBUDDY_API_URL: http://api:8000
                      CODEBUDDY_API_KEY: ${CODEBUDDY_API_KEY:?set CODEBUDDY_API_KEYS in SSM}
                    volumes:
                      - /opt/codebuddy/logs:/app/logs
                    healthcheck:
                      test: ["CMD", "python", "-c",
                             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
                      interval: 30s
                      timeout: 3s
                      start_period: 20s
                    depends_on: [api]
                    mem_limit: 500m

                  caddy:
                    image: caddy:2.11-alpine
                    restart: unless-stopped
                    logging: *logging
                    ports:
                      - "80:80"
                      - "443:443"
                    environment:
                      SITE_ADDRESS: ${SITE_ADDRESS:?}
                      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?}
                      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in SSM}
                    volumes:
                      - ./Caddyfile:/etc/caddy/Caddyfile:ro
                      - caddy-data:/data                  # certificates: keep it, Let's Encrypt has rate limits
                      - caddy-config:/config
                    depends_on: [ui]
                    mem_limit: 96m

                volumes:
                  app-data:
                  caddy-data:
                  caddy-config:
                COMPOSE
                cat > /opt/codebuddy/Caddyfile <<'CADDYFILE'
                # Caddy in front of the Streamlit UI (deploy/aws). Lives in /opt/codebuddy; the same text is
                # embedded in template.yaml (a unit test keeps them equal). Values come from the caddy
                # container's environment (compose reads them from /opt/codebuddy/.env).
                #
                # SITE_ADDRESS is DomainName, or <ip-with-dashes>.sslip.io. Caddy gets a Let's Encrypt
                # certificate on its own (needs ports 80 and 443 open to the internet) and keeps it in /data.
                # Basic auth covers the whole site: Streamlit has no login, and every visitor would spend
                # your OpenAI credit. HTTP/3 is off because the security group opens TCP only.
                {
                    servers {
                        protocols h1 h2
                    }
                }

                {$SITE_ADDRESS} {
                    basic_auth {
                        {$BASIC_AUTH_USER} {$BASIC_AUTH_HASH}
                    }

                    header {
                        Strict-Transport-Security "max-age=31536000"
                        X-Content-Type-Options "nosniff"
                        X-Frame-Options "SAMEORIGIN"
                        Referrer-Policy "strict-origin-when-cross-origin"
                        -Server
                    }

                    # Optional: publish the API too (it streams Server-Sent Events, hence flush_interval -1).
                    # Only with CODEBUDDY_API_KEYS set, because every /v1 call then needs an API key on top of
                    # basic auth. The API serves /healthz and /v1/*, so strip the /api prefix.
                    # handle_path /api/* {
                    #     reverse_proxy api:8000 {
                    #         flush_interval -1
                    #     }
                    # }

                    # The UI. WebSockets pass through reverse_proxy by default; flush_interval -1 sends
                    # streamed bytes at once instead of buffering them.
                    reverse_proxy ui:8501 {
                        flush_interval -1
                    }
                }
                CADDYFILE

                cat > /usr/local/bin/codebuddy-env <<'PY'
                #!/usr/bin/python3
                """Write /opt/codebuddy/.env from SSM Parameter Store. Re-run to refresh. Prints names only."""
                import json, os, subprocess, sys

                BASE = "/opt/codebuddy"
                NAMES = ("OPENAI_API_KEY", "GROQ_API_KEY", "UPSTASH_REDIS_REST_URL",
                         "UPSTASH_REDIS_REST_TOKEN", "QDRANT_CLUSTER_ENDPOINT", "QDRANT_API_KEY",
                         "QDRANT_COLLECTION_NAME", "LANGFUSE_PUBLIC_KEY", "LANGFUSE_SECRET_KEY",
                         "LANGFUSE_BASE_URL", "CODEBUDDY_API_KEYS", "CODEBUDDY_MEMORY_SECRET",
                         "CODEBUDDY_MODEL_FAST", "CODEBUDDY_MODEL_STANDARD", "CODEBUDDY_MODEL_HEAVY",
                         "BASIC_AUTH_HASH")
                REQUIRED = ("OPENAI_API_KEY", "CODEBUDDY_MODEL_FAST", "CODEBUDDY_MODEL_STANDARD",
                            "CODEBUDDY_MODEL_HEAVY", "CODEBUDDY_API_KEYS", "BASIC_AUTH_HASH")
                REGISTRY = ("GHCR_USER", "GHCR_TOKEN")  # optional, private image; never in .env

                site = dict(ln.split("=", 1) for ln in open(BASE + "/site.env").read().splitlines() if "=" in ln)
                prefix = site["SSM_PREFIX"].rstrip("/")
                res = subprocess.run(["aws", "ssm", "get-parameters-by-path", "--path", prefix,
                                      "--with-decryption", "--region", site["AWS_REGION"], "--output", "json"],
                                     capture_output=True, text=True)
                if res.returncode:
                    sys.exit("codebuddy-env: cannot read SSM %s: %s" % (prefix, res.stderr.strip()))
                params = {p["Name"].rsplit("/", 1)[1]: p["Value"] for p in json.loads(res.stdout)["Parameters"]}
                missing = [n for n in REQUIRED if not params.get(n)]
                if missing:
                    sys.exit("codebuddy-env: missing SSM parameters under %s: %s" % (prefix, ", ".join(missing)))
                values = {k: site[k] for k in ("IMAGE_URI", "SITE_ADDRESS", "BASIC_AUTH_USER")}
                values.update({n: params[n] for n in NAMES if params.get(n)})
                values["CODEBUDDY_API_KEY"] = params["CODEBUDDY_API_KEYS"].split(",")[0].strip()
                bad = sorted(k for k, v in values.items() if "'" in v or "\n" in v)
                if bad:
                    sys.exit("codebuddy-env: values must not contain quotes or newlines: " + ", ".join(bad))
                tmp = BASE + "/.env.tmp"
                with os.fdopen(os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), "w") as f:
                    f.write("# Written by codebuddy-env from SSM %s. Do not edit: re-run codebuddy-env.\n" % prefix)
                    f.writelines("%s='%s'\n" % (k, values[k]) for k in sorted(values))
                os.chmod(tmp, 0o600)
                os.replace(tmp, BASE + "/.env")
                print("codebuddy-env: wrote %s/.env with %s" % (BASE, ", ".join(sorted(values))))
                ignored = sorted(set(params) - set(NAMES) - set(REGISTRY))
                if ignored:
                    print("codebuddy-env: ignored unknown parameters: " + ", ".join(ignored))
                if params.get("GHCR_USER") and params.get("GHCR_TOKEN"):
                    subprocess.run(["docker", "login", "ghcr.io", "-u", params["GHCR_USER"], "--password-stdin"],
                                   input=params["GHCR_TOKEN"], text=True, check=True)
                PY

                cat > /usr/local/bin/codebuddy-update <<'SH'
                #!/bin/bash
                # Refresh .env from SSM, pull the image, recreate changed containers.
                set -euo pipefail
                cd /opt/codebuddy
                /usr/local/bin/codebuddy-env
                docker compose pull
                docker compose up -d --remove-orphans
                docker image prune -f > /dev/null
                docker compose ps
                SH

                cat > /usr/local/bin/codebuddy-status <<'SH'
                #!/bin/bash
                # Containers, API health (from inside the private network), memory and disk.
                set -euo pipefail
                cd /opt/codebuddy
                docker compose ps
                docker compose exec -T api python -c \
                  "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/healthz').read().decode())"
                free -m
                df -h /
                SH
                chmod 755 /usr/local/bin/codebuddy-env /usr/local/bin/codebuddy-update /usr/local/bin/codebuddy-status

                log "waiting for the Elastic IP $EIP_ADDRESS (Let's Encrypt must reach this server)"
                imds_token=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token \
                  -H 'X-aws-ec2-metadata-token-ttl-seconds: 600')
                for _ in $(seq 1 60); do
                  ip=$(curl -fsS -H "X-aws-ec2-metadata-token: $imds_token" \
                    http://169.254.169.254/latest/meta-data/public-ipv4 || true)
                  [ "$ip" = "$EIP_ADDRESS" ] && break
                  sleep 5
                done
                [ "$ip" = "$EIP_ADDRESS" ] || log "WARNING: Elastic IP not attached yet; Caddy will retry"

                log "pulling $IMAGE_URI and starting the containers"
                /usr/local/bin/codebuddy-update
                log "BOOTSTRAP DONE: https://$SITE_ADDRESS (the certificate can take a minute)"

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

Outputs:
  Url:
    Description: Open this in a browser and log in with BasicAuthUser and your password.
    Value: !Sub
      - https://${Host}
      - Host: !If
          - HasDomain
          - !Ref DomainName
          - !Join
            - ""
            - - !Join ["-", !Split [".", !GetAtt ElasticIp.PublicIp]]
              - .sslip.io
  InstanceId:
    Description: The EC2 instance.
    Value: !Ref Instance
  PublicIp:
    Description: Elastic IP. Point your DomainName's A record here if you use one.
    Value: !GetAtt ElasticIp.PublicIp
  ConnectCommand:
    Description: Shell on the server through Session Manager (needs the session-manager-plugin).
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${Instance}
  BootstrapLogCommand:
    Description: Follow the first-boot log.
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${Instance}
      --document-name AWS-StartInteractiveCommand
      --parameters command="sudo tail -n 100 -f /var/log/codebuddy-bootstrap.log"
  DeleteCommand:
    Description: Delete everything this stack created (stops all its charges).
    Value: !Sub aws cloudformation delete-stack --region ${AWS::Region} --stack-name ${AWS::StackName}
